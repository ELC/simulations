<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Stlite Hello World</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.7.3/build/stlite.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@stlite/browser@1.7.3/build/stlite.js"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      streamlit-app {
        display: block;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <streamlit-app src="./app.py">

      <app-file name="stlite_hello/__init__.py" url="./stlite_hello/__init__.py"></app-file>

      <app-file name="stlite_hello/app.py" url="./stlite_hello/app.py"></app-file>

      <app-file name="stlite_hello/charts.py" url="./stlite_hello/charts.py"></app-file>

      <app-requirements>

        altair==6.0.0

        numpy==2.2.5

        pandas==2.3.3

        pydantic==2.12.5

        pydantic-extra-types==2.11.1

        semver==3.0.4

        pydantic-settings==2.14.1

      </app-requirements>
    </streamlit-app>
  </body>
</html>
