[tool.poe.tasks]
test = "pytest"
check = "prek run --all-files --verbose"
snapshot-update = "pytest --snapshot-update"
sync-pyodide-constraints = "python -m stlite_hello.pyodide_sync"
check-pyodide-constraints = "python -m stlite_hello.pyodide_sync --ci"
build-site = "python -m stlite_hello.site"
serve-site = { sequence = [
    "build-site",
    { shell = "python -m http.server 8000 --directory _site" },
] }
dev = "streamlit run src/stlite_hello/app.py"
ci = { sequence = [
    "check",
    "check-pyodide-constraints",
    "test",
    "build-site",
] }

[tool.poe.tasks.dev-feature]
help = "Run one simulation slice"
cmd = "streamlit run src/stlite_hello/features/${feature}/__main__.py"
args = [{ name = "feature", positional = true, help = "Feature slice: yard_sale | kinetic_exchange | double_auction | cournot | sugarscape | labor_matching | preferential_attachment" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-vv",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = [
    "src/stlite_hello",
    "tests",
]
omit = [
    "src/**/__main__.py",
    "src/stlite_hello/pyarrow_compat.py",
]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]


#########################
# MyPy
#########################

[tool.mypy]
strict = true
follow_imports = "normal"
mypy_path = "src:stubs"
python_version = "3.13"
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true
ignore_missing_imports = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "dependency_injector.*",
    "networkx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "stlite_hello.features.preferential_attachment.model",
]
disallow_any_unimported = false


#########################
# RUFF
#########################

[tool.ruff]
fix = true
preview = true
unsafe-fixes = true
line-length = 120
src = ["src"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "D",      # pydocstyle
    "CPY",    # copyright notices
    "S101",   # assert usage
    "ISC001", # implicit string concat
    "ANN401", # any type
    "COM812", # trailing comma
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in defaults (FastAPI Depends)
    "ARG002", # unused method argument
    "RUF067", # __init__ module logic (FastAPI router pattern)
    "S105",   # hardcoded password (dev defaults in pydantic settings)
    "S107",   # hardcoded password in default (false positive on token_type)
    "DOC501", # raised exception missing from docstring
    "DOC502", # documented exception from inner function (API docs clarity)
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


#########################
# Pylint
#########################

[tool.pylint.main]
extension-pkg-allow-list = [
    "mypy",
    "dependency_injector",
    "pydantic_settings",
]
load-plugins = ["pylint_pydantic"]

[tool.pylint.typecheck]
generated-members = ["sqlalchemy.func.*"]
contextmanager-decorators = ["contextlib.contextmanager"]
ignore-none = true
ignore-on-opaque-inference = true
ignored-checks-for-mixins = [
    "no-member",
    "not-async-context-manager",
    "not-context-manager",
    "attribute-defined-outside-init",
]
ignored-classes = ["optparse.Values", "thread._local", "_thread._local"]
missing-member-hint = true
missing-member-hint-distance = 1
missing-member-max-choices = 1
mixin-class-rgx = ".*[Mm]ixin"

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0301",  # line-too-long (handled by ruff format)
    "E0401",  # import-error (already validated by mypy)
    "R0801",  # duplicate-code (acceptable for response builders)
    "R0903",  # too-few-public-methods (dataclasses/DTOs)
    "R0913",  # too-many-arguments (DI constructors)
    "R0917",  # too-many-positional-arguments (DI constructors)
    "W0621",  # pytest fixture parameter names shadow outer fixtures
]


#########################
# Pymetrica
#########################

[tool.pymetrica]
exclude = []
