[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stlite_hello"

[project]
name = "stlite-hello"
version = "0.1.0"
description = "Free-market simulations: in-browser Streamlit with bootstrap CIs, KDE, and best-fit distributions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "altair==6.0.0",
    "networkx==3.4.2",
    "numpy==2.2.5",
    "pandas==2.3.3",
    "pandera==0.31.1",
    "pydantic==2.12.5",
    "pydantic-extra-types==2.11.1",
    "pydantic-settings==2.14.1",
    "scipy==1.14.1",
    "semver==3.0.4",
    "statsmodels==0.14.4",
    "streamlit==1.57.0",
]

[dependency-groups]
